// Root build.gradle for katalon-ai project
// This file defines common configuration for all subprojects

buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

allprojects {
    repositories {
        mavenCentral()
    }
}

// Common configuration that will be applied to all subprojects
subprojects {
    // Apply common plugins if needed
    apply plugin: 'java-library'
    apply plugin: 'groovy'
    apply plugin: 'checkstyle'
    
    // Common dependencies if needed
    dependencies {
        // Common dependencies can be defined here
    }
    
    // Common configurations if needed
    configurations {
        all*.exclude group: 'org.codehaus.groovy'
    }
    
    // Code quality configuration
    checkstyle {
        toolVersion = '8.45'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        ignoreFailures = false
        maxWarnings = 0
    }
    
    // Java/Groovy source compatibility
    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

// Root level tasks
task codeQualityCheck {
    group = 'verification'
    description = 'Runs all code quality checks across all subprojects'
    dependsOn subprojects*.checkstyleMain
}

task buildAll {
    group = 'build'
    description = 'Builds all subprojects'
    dependsOn subprojects*.build
}

task testAll {
    group = 'verification'
    description = 'Runs tests for all subprojects'
    dependsOn subprojects*.test
}